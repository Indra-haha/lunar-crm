services:
  lunar:
    image: node:22-alpine
    container_name: lunar
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 3000"
    volumes:
      - .:/app
      - lunar_node_modules:/app/node_modules
    expose:
      - '3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      DATABASE_URL: postgresql://${LUNAR_DB_USER}:${LUNAR_DB_PASSWORD}@postgres:5432/${LUNAR_DB_NAME}
    networks:
      - app-net
      - db-net

  lunar-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ['npm', 'run', 'db:migrate']
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${LUNAR_DB_USER}:${LUNAR_DB_PASSWORD}@postgres:5432/${LUNAR_DB_NAME}
    networks:
      - db-net
    restart: 'no'

networks:
  app-net:
    external: true
    name: server-tugas_app-net

  db-net:
    external: true
    name: server-tugas_db-net