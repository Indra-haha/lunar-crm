services:
  lunar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lunar
    restart: unless-stopped
    expose:
      - '3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      DATABASE_URL: postgresql://${LUNAR_DB_USER}:${LUNAR_DB_PASSWORD}@postgres:5432/${LUNAR_DB_NAME}
    networks:
      - app-net
      - db-net

  lunar-seed:
    image: node:22-slim
    container_name: lunar-seed
    working_dir: /app
    command: sh -c "npm install && npm run db:seed"
    volumes:
      - .:/app
      - lunar_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${LUNAR_DB_USER}:${LUNAR_DB_PASSWORD}@postgres:5432/${LUNAR_DB_NAME}
    networks:
      - db-net
    restart: 'no'
    profiles: ['tools']

volumes:
  lunar_node_modules:

networks:
  app-net:
    external: true
    name: server-tugas_app-net

  db-net:
    external: true
    name: server-tugas_db-net
