services:
  lunar:
    image: node:22-alpine
    container_name: lunar
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run db:migrate && npm run build && npm run start -- -H 0.0.0.0 -p 3000"
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - lunar_node_modules:/app/node_modules
    expose:
      - '3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      DATABASE_URL: postgresql://${LUNAR_DB_USER}:${LUNAR_DB_PASSWORD}@postgres:5432/${LUNAR_DB_NAME}
    networks:
      - app-net
      - db-net

  lunar-seed:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm run db:seed"
    volumes:
      - .:/app
      - lunar_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${LUNAR_DB_USER}:${LUNAR_DB_PASSWORD}@postgres:5432/${LUNAR_DB_NAME}
    networks:
      - db-net
    restart: 'no'
    profiles: ['tools']
    
volumes:
  lunar_node_modules:

networks:
  app-net:
    external: true
    name: server-tugas_app-net

  db-net:
    external: true
    name: server-tugas_db-net
